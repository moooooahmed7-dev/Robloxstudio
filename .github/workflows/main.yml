name: AnyDesk - Install and Show ID

on:
  workflow_dispatch:

jobs:
  anydesk:
    # لازم يكون Windows self-hosted runner على جهازك
    runs-on: [self-hosted, Windows]

    steps:
      - name: Check Windows
        shell: powershell
        run: |
          Write-Host "Windows runner detected."
          Write-Host "Computer: $env:COMPUTERNAME"

      - name: Find AnyDesk
        id: find
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files (x86)\AnyDesk\AnyDesk.exe",
            "C:\Program Files\AnyDesk\AnyDesk.exe"
          )

          $anydesk = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $anydesk) {
            Write-Host "AnyDesk is not installed."
            "installed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          Write-Host "AnyDesk found:"
          Write-Host $anydesk

          "installed=true" >> $env:GITHUB_OUTPUT
          "path=$anydesk" >> $env:GITHUB_OUTPUT

      - name: Start AnyDesk
        if: steps.find.outputs.installed == 'true'
        shell: powershell
        run: |
          $anydesk = "${{ steps.find.outputs.path }}"

          Start-Process -FilePath $anydesk

          Start-Sleep -Seconds 5

          Write-Host "AnyDesk started."

      - name: Get AnyDesk ID
        if: steps.find.outputs.installed == 'true'
        shell: powershell
        run: |
          $anydesk = "${{ steps.find.outputs.path }}"

          $id = (& $anydesk --get-id 2>$null | Out-String).Trim()

          if ([string]::IsNullOrWhiteSpace($id)) {
            Write-Error "Could not read the AnyDesk ID."
            exit 1
          }

          Write-Host ""
          Write-Host "================================"
          Write-Host "          AnyDesk ID"
          Write-Host "================================"
          Write-Host $id
          Write-Host "================================"

      - name: AnyDesk Not Installed
        if: steps.find.outputs.installed != 'true'
        shell: powershell
        run: |
          Write-Host "AnyDesk was not found on this Windows machine."
          Write-Host "Install AnyDesk normally, then run this workflow again."
          exit 1
