name: Install AnyDesk

on:
  workflow_dispatch:

jobs:
  install-anydesk:
    runs-on: [self-hosted, Windows]

    steps:
      - name: Download AnyDesk
        shell: powershell
        run: |
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $file = "$env:TEMP\AnyDesk.exe"

          Invoke-WebRequest -Uri $url -OutFile $file

          if (-not (Test-Path $file)) {
              throw "AnyDesk download failed."
          }

          Write-Host "Downloaded AnyDesk."

      - name: Install AnyDesk
        shell: powershell
        run: |
          $file = "$env:TEMP\AnyDesk.exe"

          Start-Process `
            -FilePath $file `
            -ArgumentList "--install", "`"$env:ProgramFiles(x86)\AnyDesk`"", "--start-with-win" `
            -Wait

          Remove-Item $file -Force -ErrorAction SilentlyContinue

      - name: Start AnyDesk and Show ID
        shell: powershell
        run: |
          $paths = @(
            "$env:ProgramFiles(x86)\AnyDesk\AnyDesk.exe",
            "$env:ProgramFiles\AnyDesk\AnyDesk.exe"
          )

          $anydesk = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $anydesk) {
              throw "AnyDesk.exe was not found."
          }

          Start-Process $anydesk
          Start-Sleep -Seconds 5

          $id = (& $anydesk --get-id 2>$null | Out-String).Trim()

          Write-Host ""
          Write-Host "=============================="
          Write-Host "       AnyDesk ID"
          Write-Host "=============================="
          Write-Host $id
          Write-Host "=============================="
